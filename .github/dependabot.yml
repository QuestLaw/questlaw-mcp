version: 2
updates:
  # The package declares no runtime dependencies, and test/packaging.test.js
  # enforces that. eslint is the one devDependency, used only by `npm run lint`
  # and never published, so the npm entry below only ever proposes eslint updates.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: dev
    allow:
      - dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
