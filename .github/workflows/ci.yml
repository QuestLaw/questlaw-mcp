name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The default token is read-only. Nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '24']
    defaults:
      run:
        # bash on every runner, Windows included, so steps behave the same. npm
        # still runs package scripts through cmd.exe on Windows, which is why
        # `npm test` names its test files itself (tools/test.js).
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      # Deliberately no `npm ci`. The server has no runtime dependencies, so the
      # tests run against exactly what a user installs, with nothing else on the
      # module path to hide a missing file or an accidental require. eslint, the
      # one devDependency, is installed only in the lint job.

      - name: Verify vendored module digests
        run: npm run verify

      - name: Test
        run: npm test

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # --ignore-scripts: linting needs eslint's code, never its install hooks.
      - name: Install eslint
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

  bundle:
    name: build artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Build the .mcpb bundle
        run: npm run bundle

      - name: Build the Claude Code plugin
        run: npm run plugin

      - name: Show what was built
        run: ls -la dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles
          path: dist/
          retention-days: 14
