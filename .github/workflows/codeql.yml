name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query still finds this code.
    - cron: '27 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze javascript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Code scanning on a private repository needs GitHub Advanced Security.
    # Skip rather than fail while this repo is private.
    if: github.event_name == 'schedule' || github.event.repository.visibility == 'public'
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: /language:javascript-typescript
