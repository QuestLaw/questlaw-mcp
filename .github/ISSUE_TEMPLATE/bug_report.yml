name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste anything out of your library.** Notes, quotations and
        captured opinion text are exactly what this connector is built to keep
        local. Describe the shape of the problem instead.

        For anything affecting confidentiality or key handling, use a private
        security advisory rather than this form.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `questlaw-library-mcp doctor`
      description: Redact paths if you need to. This reports no library contents.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: '0.5.0'
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: Which client
      options: [Claude Code, Claude Desktop, Codex, ChatGPT, Other, None - CLI only]
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: OS and Node version
      placeholder: 'macOS 15.2, Node 24.1.0'
    validations:
      required: true
